:root{
  --blanco:#FFFFFF; --niebla:#F3F3F7; --hielo:#C4DFEC; --cielo:#95C0D9; --marino:#0F314A;
  --ambar:#E79322; --naranja:#E27128; --oxido:#C0492B; --rojo:#B23128;
  --texto:#0F314A; --texto-2:#5B6B78; --texto-3:#8E9AA4; --linea:#E3E6EC;
  --sombra:0 0 0 .5px #C9D2DC;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"General Sans",system-ui,sans-serif;color:var(--texto);background:#DDE2E9;display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.phone{width:390px;height:866px;border-radius:46px;background:var(--niebla);position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(15,49,74,.25),0 0 0 10px #10202c,0 0 0 11px #2b3a46}
@media (max-width:500px){body{background:var(--niebla);display:block}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
body.capture{background:var(--niebla);display:block}
body.capture .phone{border-radius:0;box-shadow:none}

/* fondo: brillos fríos difuminados */
.glow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.glow i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75}
.glow i:nth-child(1){width:300px;height:260px;background:var(--hielo);top:-90px;right:-80px}
.glow i:nth-child(2){width:220px;height:200px;background:var(--cielo);top:-60px;left:-110px;opacity:.35}
.glow i:nth-child(3){width:260px;height:220px;background:var(--hielo);bottom:60px;left:-140px;opacity:.4}

.status{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;z-index:30}
.status .ic{display:flex;gap:6px;align-items:center}
.view{position:absolute;inset:0;padding-top:44px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:2}
.view::-webkit-scrollbar{display:none}
.view.anim-push{animation:push .32s cubic-bezier(.2,.8,.2,1)}
.view.anim-back{animation:back .32s cubic-bezier(.2,.8,.2,1)}
.view.anim-fade{animation:fade .25s ease}
@keyframes push{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes back{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pad{padding:8px 20px 120px}
.gesture{position:absolute;bottom:8px;left:50%;width:120px;height:4px;border-radius:2px;background:var(--marino);opacity:.85;transform:translateX(-50%);z-index:40}

/* tipografía */
.h1{font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.01em}
.h2{font-weight:600;font-size:18px;line-height:1.25}
.h3{font-weight:600;font-size:15px;line-height:1.3}
.p{font-size:14px;line-height:1.5;color:var(--texto-2)}
.cap{font-size:12px;color:var(--texto-3)}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-3)}
.warm{color:var(--oxido)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec a{font-size:13px;color:var(--texto-2);cursor:pointer}

/* íconos de línea */
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter;flex:none}
svg.i.s{width:18px;height:18px}
svg.i.xs{width:15px;height:15px;stroke-width:2}

/* componentes */
.card{background:var(--blanco);border-radius:var(--r);box-shadow:var(--sombra)}
.glass{background:rgba(255,255,255,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);border-radius:var(--r);box-shadow:var(--sombra)}
.btn{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:400;width:100%;transition:transform .12s}
.btn[onclick]:active{transform:scale(.98)}
button:not([onclick]){cursor:default}
.btn.pri{background:var(--marino);color:#fff}
.btn.sec2{background:var(--hielo);color:var(--marino)}
.btn.ghost{border:1.5px solid var(--marino);color:var(--marino)}
.icbtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--marino)}
.icbtn.fill{background:var(--blanco);box-shadow:var(--sombra)}
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:14px;padding:0 14px;color:var(--texto-3);font-size:14px}
.search input{border:0;background:none;outline:0;flex:1;font-size:14px}
.search input::placeholder{color:var(--texto-3)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.7);box-shadow:var(--sombra)}
.seg button{flex:1;height:36px;border-radius:10px;font-size:13px;color:var(--texto-2);transition:.2s}
.seg button.on{background:var(--marino);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;font-size:13px;background:var(--blanco);color:var(--texto-2);box-shadow:var(--sombra)}
.chip.on{background:var(--marino);color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:600;background:var(--niebla);color:var(--texto-2)}
.tag.warm{background:#FBEDE3;color:var(--oxido)}
.tag.ok{background:#E3F0F6;color:#2F6A8C}
.tag.now{background:var(--marino);color:#fff}
.toast{position:absolute;left:20px;right:20px;bottom:110px;z-index:60;background:var(--marino);color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;display:flex;gap:10px;align-items:center;transform:translateY(20px);opacity:0;transition:.3s;pointer-events:none}
.toast.on{transform:none;opacity:1}

/* barra de navegación flotante */
.nav{position:absolute;left:16px;right:16px;bottom:22px;height:66px;z-index:50;display:flex;justify-content:space-around;align-items:center;padding:0 6px;border-radius:22px;background:rgba(255,255,255,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);box-shadow:var(--sombra);transition:transform .3s,opacity .3s}
.nav.hide{transform:translateY(120px);opacity:0}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;color:var(--texto-3);font-size:10.5px;font-weight:600;position:relative}
.nav button.on{color:var(--c)}
.nav button.on::after{content:"";position:absolute;top:-11px;width:22px;height:3px;border-radius:2px;background:var(--c)}

/* acordeón */
.acc{overflow:hidden}
.acc-h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;text-align:left}
.acc-h svg{transition:transform .3s}
.acc.open .acc-h svg.chev{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden}

/* miniaturas de materia */
.thumb{flex:none;border-radius:12px;display:flex;align-items:flex-end;padding:8px;color:var(--marino);font-weight:700;font-size:20px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.thumb .gl{position:absolute;right:-6px;top:-10px;font-size:54px;font-weight:700;opacity:.22;line-height:1}

/* masonry */
.mas{columns:2;column-gap:12px}
.mas>*{break-inside:avoid;margin-bottom:12px;display:block;width:100%;text-align:left}
.post img{width:100%;display:block;border-radius:14px}
.post .meta{padding:8px 2px 2px}
.note{border-radius:14px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}

/* timeline */
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:var(--linea)}
.tl .dot{position:absolute;left:-28px;top:18px;width:20px;height:20px;border-radius:50%;background:var(--niebla);border:2px solid var(--cielo);display:flex;align-items:center;justify-content:center;color:#fff}
.tl .dot.done{background:var(--cielo);border-color:var(--cielo)}
.tl .dot.now{border-color:var(--naranja);background:#fff}
.tl .dot.now::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--naranja)}
.tl-item{position:relative;margin-bottom:12px}

.row{display:flex;align-items:center;gap:12px}
.list-i{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linea);width:100%;text-align:left}
.list-i:first-child{border-top:0}
.fileic{width:40px;height:40px;border-radius:10px;background:var(--niebla);display:flex;align-items:center;justify-content:center;color:var(--oxido);flex:none}
.avatar{border-radius:50%;background:var(--marino);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.prog{height:6px;border-radius:3px;background:var(--niebla);overflow:hidden}
.prog i{display:block;height:100%;background:var(--cielo);border-radius:3px}
.field{height:52px;border-radius:12px;background:var(--blanco);border:1.5px solid var(--linea);display:flex;align-items:center;padding:0 16px;gap:10px;margin-bottom:12px;font-size:15px}
.field input{border:0;outline:0;flex:1;background:none}
.field input::placeholder{color:var(--texto-3)}
.field:focus-within{border-color:var(--cielo)}
.field small{font-size:11px;color:var(--texto-3);position:absolute}
.drop{position:absolute;left:20px;right:20px;z-index:20;padding:6px}
.drop button{display:flex;width:100%;padding:12px;border-radius:10px;font-size:15px;align-items:center;gap:12px}
.drop button:hover{background:var(--niebla)}
.week{display:flex;justify-content:space-between}
.week div{width:40px;text-align:center;padding:8px 0;border-radius:12px;font-size:12px;color:var(--texto-2)}
.week b{display:block;font-size:16px;font-weight:600;color:var(--texto);margin-top:2px}
.week div.on{background:var(--marino);color:#fff}
.week div.on b{color:#fff}
.week i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:var(--naranja)}
.splash{position:absolute;inset:0;background:var(--marino);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:70;transition:opacity .5s}
.reader p{font-size:15.5px;line-height:1.65;color:#2A4152;margin-bottom:14px}
.reader h4{font-size:17px;font-weight:600;margin:22px 0 8px}
.pagebox{background:#fff;border-radius:6px;box-shadow:var(--sombra);aspect-ratio:1/1.41;padding:20px;display:flex;flex-direction:column;gap:8px}
.pagebox i{display:block;height:6px;border-radius:3px;background:#E8EBF0}
</style>
</head>

const view=document.getElementById('view'), nav=document.getElementById('nav');

function go(id,p={},mode='push'){
  if(mode==='tab'){S.stack=[{id,p}]} else S.stack.push({id,p});
  render(mode==='tab'?'fade':'push');
}
function back(){ if(S.stack.length>1){S.stack.pop();render('back')} }
function cur(){return S.stack[S.stack.length-1]}
function render(anim='fade'){
  const c=cur(); const html=SCREENS[c.id](c.p||{});
  view.innerHTML=html; view.scrollTop=0;
  view.className='view anim-'+anim;
  S.tab=TAB_OF[c.id]||S.tab;
  nav.classList.toggle('hide',NO_NAV.includes(c.id));
  drawNav();
  try{history.replaceState(null,'','#'+c.id+(c.p&&c.p.key?'-'+c.p.key:''))}catch(e){}
}
function drawNav(){
  nav.innerHTML=TABS.map(([k,l,c])=>`<button class="${S.tab===k?'on':''}" style="--c:${c}" onclick="go('${k}',{},'tab')">${ic(k)}<span>${l}</span></button>`).join('');
}
function toast(msg){return;const t=document.getElementById('toast');t.innerHTML=ic('check','s')+msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2000)}

      ${S.modal?`<div class="drop card" style="top:30px;left:0;right:auto;width:260px">${ORDER.map(k=>`<button onclick="S.modal=false;S.stack[S.stack.length-1].p={m:'${k}',key:'${k}'};render('fade')">${thumb(k,28,28,12)}${M[k].name}${k===p.m?'<span style="margin-left:auto;color:var(--naranja)">'+ic('check','s')+'</span>':''}</button>`).join('')}</div>`:''}

          `<div style="text-align:center;padding:10px 0 14px"><p class="p" style="font-size:13px">Todavía no hay apuntes ni lecturas.</p><button class="btn sec2" style="height:40px;margin-top:10px;font-size:14px">${ic('mas','s')} Subir el primero</button></div>`}
        </div></div></div>

clase(p){

  return `<div class="pad" style="padding-bottom:130px">
    <div class="row" style="justify-content:space-between;margin:6px 0 12px">${backBtn(m.name)}<button class="icbtn">${ic('guardar')}</button></div>
    <div class="row" style="gap:10px"><div class="avatar" style="width:34px;height:34px;background:${m.bg};color:var(--marino);font-size:11px">${m.gl}</div><div><div class="cap">${u.n} · ${u.t}</div><div class="h2">${c.t}</div></div></div>
    <div style="margin-top:18px">${hero}
      <button style="position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:var(--marino)">${ic('play')}</button>
      <span class="tag" style="position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.85)">${ic('reloj','xs')} 24 min</span></div></div>
    <p class="p" style="margin-top:16px">${c.d}</p>
    ${c.tp?`<div class="glass" style="padding:14px;margin-top:14px;border-left:3px solid var(--naranja)"><div class="row" style="gap:8px;color:var(--oxido)">${ic('cal','s')}<span class="h3">Entrega: viernes 6 de noviembre</span></div><p class="cap" style="margin-top:4px">Bocetos escaneados en una lámina A3.</p></div>`:''}

    <button class="btn sec2" style="width:50px;flex:none">${ic('mas')}</button>

documento(p){
  const d=DOCS[p.d];

  const title=d?d.title:p.f.replace(/\.(pdf|pages)$/,''); const m=M[p.m];

    <div class="row" style="justify-content:space-between;margin:6px 0 18px">${backBtn(m.name)}<div class="row" style="gap:4px"><button class="icbtn">${ic('compartir','s')}</button><button class="icbtn" style="color:var(--naranja)">${ic('bajar')}</button></div></div>

  </div>`},

explorar(){

publicacion(p){
  const x=POSTS.find(q=>q.id===p.id); const saved=S.saved.has(x.id);
  const sim=POSTS.filter(q=>q.id!==x.id&&q.m===x.m).slice(0,4);
  return `<div style="padding:6px 20px 120px">

      <button class="icbtn">${ic('compartir','s')}</button></div>
    ${x.img?`<img src="${IMG[x.img]}" style="width:100%;border-radius:18px;display:block;box-shadow:var(--sombra)">`:`<div class="note" style="background:${x.bg};min-height:320px;border-radius:18px;${x.dark?'color:#fff':''}"><span class="label" style="${x.dark?'color:#95C0D9':''}">${M[x.m].name}</span><div style="font-size:30px;font-weight:700;line-height:1.1">${x.t}</div></div>`}

    <div class="sec"><div class="h2">Proyectos similares</div></div>
    <div class="mas">${sim.map(x=>postCard(x,false)).join('')}</div>
  </div>`},

fadu(){
  const seg=S.faduSeg;
  const cards=[['ingreso','Ingreso','Locales y extranjeros','#C4DFEC'],['tramites','Trámites','Inscripciones y certificados','#FFFFFF'],['carreras','Carreras','Planes de estudio','#FFFFFF'],['centro','Centro de estudiantes','Apuntes y becas','#FFFFFF'],['biblio','Biblioteca','Horarios y catálogo','#FFFFFF'],['sedes','Sedes','Ciudad Universitaria','#FFFFFF']];
  const icn={ingreso:'sig',tramites:'doc',carreras:'libro',centro:'gente',biblio:'carpeta',sedes:'mapa'};
  let body='';
  if(seg<2) body=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${cards.map(([k,t,s,b],i)=>`<button class="card" style="padding:14px;text-align:left;min-height:${i%3===0?140:116}px;display:flex;flex-direction:column;justify-content:space-between" ${k==='ingreso'?`onclick="go('documento',{d:'ingreso',m:'icp',key:'ingreso'})"`:''}><span style="color:var(--oxido)">${ic(icn[k])}</span><div class="h3">${t}</div></button>`).join('')}</div>
    <div class="sec"><div class="h2">${seg===0?'Para el CBC':'Para UBA XXI'}</div></div>
    <div class="card" style="padding:4px 16px">${(seg===0?['Materias del CBC para tu carrera','Sedes y horarios de cursada','Regularidad y promoción']:['Cómo funciona la modalidad virtual','Exámenes en sede','Materias del CBC por UBA XXI']).map(t=>`<button class="list-i"><span style="flex:1;font-size:14px">${t}</span>${ic('chevr','s')}</button>`).join('')}</div>`;
  else body=`<div class="card" style="overflow:hidden">${faduFoto(150)}<div style="padding:16px"><div class="label">Historia</div><div class="h2" style="margin-top:4px">La FADU</div><p class="p" style="margin-top:8px">La facultad nació formando arquitectos y, con los años, sumó las carreras de diseño. Hoy funciona en el Pabellón III de Ciudad Universitaria.</p></div></div>
    <div class="sec"><div class="h2">Para leer</div></div>
    <div class="card" style="padding:4px 16px">${['La Reforma Universitaria de 1918','Manifiesto liminar','Estatuto de la UBA'].map(t=>`<button class="list-i"><div class="fileic">${ic('doc','s')}</div><span style="flex:1;font-size:14px;text-align:left">${t}</span>${ic('chevr','s')}</button>`).join('')}</div>`;
  return `<div class="pad">
    <div class="seg" style="margin:6px 0 14px">${['CBC','UBA XXI','Historia'].map((t,i)=>`<button class="${seg===i?'on':''}" onclick="S.faduSeg=${i};rer()">${t}</button>`).join('')}</div>
    ${searchBar('Buscar en FADU')}
    <div class="row" style="gap:10px;margin:22px 0 4px"><span style="color:var(--oxido)">${ic('fadu')}</span><div class="h1">FADU</div></div>
    <p class="p" style="margin-bottom:18px">Facultad de Arquitectura, Diseño y Urbanismo · UBA</p>
    ${body}
  </div>`},

perfil(){
  const seg=S.perfilSeg;
  let body='';
  if(seg===0) body=`
    <button class="card" style="padding:16px;width:100%;text-align:left" onclick="S.perfilSeg=1;rer()">
      <div class="row" style="justify-content:space-between"><div class="row" style="gap:10px"><span style="color:var(--ambar)">${ic('cursada','s')}</span><span class="h3">Mi cursada</span></div>${ic('chevr','s')}</div>
      <div class="row" style="gap:18px;margin-top:14px">
        <div><div class="h1">1</div><div class="cap">aprobada</div></div><div><div class="h1">5</div><div class="cap">cursando</div></div><div><div class="h1 warm">2</div><div class="cap">entregas</div></div>
      </div>
      <div class="prog" style="margin-top:14px"><i style="width:17%"></i></div><div class="cap" style="margin-top:6px">CBC · 1 de 6 materias aprobadas</div>
    </button>
    ${calBlock(3)}`;
  if(seg===1) body=`<div class="card" style="padding:18px 16px 6px"><div class="tl">${[
      ['2026 · 1er cuatrimestre',[['icp1','Aprobada']]],
      ['2026 · 2do cuatrimestre',[['icp','Cursando'],['mat','Cursando'],['sye','Cursando'],['ipc','Cursando'],['sem','Cursando']]],
      ['2027 · 1er año',[[null,'Diseño Gráfico']]]].map(([t,ms],i)=>`<div class="tl-item" style="margin-bottom:18px"><span class="dot ${i==0?'done':i==1?'now':'next'}" style="top:0">${i==0?ic('check','xs'):''}</span><div class="label" style="margin-bottom:10px">${t}</div>
      ${ms.map(([m,s])=>m?`<button class="row" style="gap:10px;width:100%;margin-bottom:8px;text-align:left" ${m==='icp'?`onclick="go('materia',{m:'icp',key:'icp'})"`:''}>${thumb(m,36,36,14)}<span style="flex:1;font-size:14px;font-weight:600">${M[m].name}</span><span class="tag ${s==='Aprobada'?'ok':''}">${s}</span></button>`:`<div class="row" style="gap:10px;color:var(--texto-3)">${ic('candado','s')}<span style="font-size:14px">${s} · se habilita al terminar el CBC</span></div>`).join('')}</div>`).join('')}</div></div>`;
  if(seg===2) body=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${BOARDS.map(b=>`<button style="text-align:left" ${b.id==='b1'?`onclick="go('tablero',{b:'b1',key:'b1'})"`:''}><div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:14px;overflow:hidden;aspect-ratio:1;box-shadow:var(--sombra)">${(b.imgs||b.notes).map(v=>`<div style="${b.imgs?bg(v)+';background-size:cover;background-position:center':'background:'+v}"></div>`).join('')}</div><div class="h3" style="margin-top:8px">${b.t}</div><div class="cap">${b.n} elementos</div></button>`).join('')}
    <button class="card" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--naranja);box-shadow:none;border:1.5px dashed var(--cielo);background:transparent">${ic('mas')}<span style="font-size:13px;font-weight:600">Nuevo tablero</span></button></div>`;
  if(seg===3) body=calBlock(5);
  return `<div class="pad">
    <div class="row" style="justify-content:space-between;margin:6px 0 16px">
      <div class="row" style="gap:12px"><div class="avatar" style="width:58px;height:58px;font-size:20px">NS</div><div><div class="h2">Nicolás Salazar</div><div class="cap">Diseño Gráfico · CBC UBA XXI</div></div></div>
      <button class="icbtn fill">${ic('ajustes','s')}</button></div>
    <div class="chips" style="margin-bottom:16px">${['Resumen','Cursada','Tableros','Calendario'].map((t,i)=>`<button class="chip ${seg===i?'on':''}" onclick="S.perfilSeg=${i};rer()">${t}</button>`).join('')}</div>
    ${body}
  </div>`},

tablero(p){
  const b=BOARDS.find(x=>x.id===p.b);
  const items=b.id==='b3'||b.id==='b4'?POSTS.filter(x=>x.note):POSTS.filter(x=>x.img&&(b.imgs.includes(x.img)||S.saved.has(x.id)));
  return `<div class="pad">
    <div class="row" style="justify-content:space-between;margin:6px 0 14px">${backBtn('Perfil')}<button class="icbtn">${ic('dots','s')}</button></div>
    <div class="label">Tablero</div><div class="h1" style="margin:6px 0 4px">${b.t}</div><p class="cap" style="margin-bottom:18px">${items.length} elementos · privado</p>
    <div class="mas">${items.map(x=>postCard(x)).join('')}</div></div>`},
};

function faduFoto(h){return IMG.fadu?`<div style="height:${h}px;${bg('fadu')};background-size:cover;background-position:center"></div>`:`<div style="height:${h}px;background:var(--marino);display:flex;align-items:center;justify-content:center;color:var(--cielo)"><svg class="i" viewBox="0 0 24 24" style="width:44px;height:44px;stroke-width:1.4">${P.fadu}</svg></div>`}
function postCard(x,act=true){

  <div class="meta"><div style="font-size:13px;font-weight:600;line-height:1.25">${x.t}</div><div class="cap">${x.a}</div></div></button>`;
}
function evList(n){
  return `<div class="card" style="padding:4px 16px">${EVENTS.slice(0,n).map(e=>`<div class="list-i"><div style="width:42px;text-align:center"><div class="cap">${e.d}</div><div class="h2 ${e.k==='entrega'||e.k==='examen'?'warm':''}">${e.n}</div></div><div style="flex:1"><div class="h3">${e.t}</div><div class="cap">${e.m}</div></div>${evTag(e.k)}</div>`).join('')}</div>`;
}
function calBlock(n){
  return `<div class="sec"><div class="row" style="gap:8px"><span style="color:var(--rojo)">${ic('cal','s')}</span><span class="h2">Noviembre</span></div></div>${evList(n)}`;
}
function faduDoc(){
  return `<div class="pad" style="padding-bottom:60px">
    <div class="row" style="justify-content:space-between;margin:6px 0 18px">${backBtn('FADU')}<button class="icbtn" style="color:var(--naranja)">${ic('bajar')}</button></div>
    <div class="label">FADU · Guía de ingreso</div>
    <div class="h1 warm" style="margin:8px 0 12px">Ingreso</div>
    <p class="p">Para empezar una carrera de la FADU primero cursás el Ciclo Básico Común, de forma presencial o a distancia por UBA XXI.</p>
    <div style="border-radius:16px;overflow:hidden;margin:18px 0">${faduFoto(160)}</div>
    ${[['loc','Estudiantes locales','Necesitás DNI, título secundario o constancia de título en trámite y completar la preinscripción online. Después elegís sede y modalidad.'],['ext','Estudiantes extranjeros','Además del documento, el título secundario tiene que estar legalizado y convalidado en Argentina. Conviene empezar el trámite con tiempo.'],['pasos','Paso a paso','1. Preinscripción online. 2. Presentación de documentación. 3. Elección de sede y horario. 4. Inscripción a materias del CBC.']].map(([k,t,d],i)=>{const open=S.openAcc['ing'+k]??(i===0);return `<div class="acc card ${open?'open':''}" style="margin-bottom:10px"><button class="acc-h" onclick="S.openAcc['ing${k}']=!this.closest('.acc').classList.contains('open');acc(this)"><span class="h3">${t}</span>${ic('chev','s chev')}</button><div class="acc-b"><div><p class="p" style="padding:0 16px 16px">${d}</p></div></div></div>`}).join('')}
    <p class="cap" style="margin-top:14px">Información de referencia. Confirmá requisitos y fechas en los canales oficiales de la UBA.</p>
  </div>`;
}

function boot(){
  const h=(location.hash||'').slice(1);
  if(new URLSearchParams(location.search).has('capture')) document.body.classList.add('capture');
  const map={inicio:['inicio'],cursada:['cursada'],explorar:['explorar'],fadu:['fadu'],perfil:['perfil'],registro:['registro'],
    'materia-mat':['materia',{m:'mat',key:'mat'}],'materia-icp':['materia',{m:'icp',key:'icp'}],'materia-sye':['materia',{m:'sye',key:'sye'}],
    'clase-tp4':['clase',{m:'icp',u:3,c:1,key:'tp4'}],'publicacion-p1':['publicacion',{id:'p1',key:'p1'}],'documento-ingreso':['documento',{d:'ingreso',m:'icp',key:'ingreso'}],
    'perfil-cursada':['perfil',null,1],'perfil-tableros':['perfil',null,2],'perfil-calendario':['perfil',null,3]};
  if(map[h]){const [id,p,ps]=map[h]; if(ps!==undefined)S.perfilSeg=ps; S.stack=[{id:TAB_OF[id]?(id==='materia'||id==='clase'?'cursada':id==='publicacion'?'explorar':id==='documento'?'fadu':id):id,p:{}}]; if(['materia','clase','publicacion','documento'].includes(id)) S.stack.push({id,p}); render('fade'); return;}
  S.stack=[{id:'registro',p:{}}]; render('fade');
  const sp=document.createElement('div'); sp.className='splash';
  sp.innerHTML=`<div style="width:210px">${LOGO_W}</div><span style="color:#95C0D9;font-size:13px;letter-spacing:.04em">Tu cursada, en un solo lugar</span>`;
  document.getElementById('phone').appendChild(sp);
  setTimeout(()=>{sp.style.opacity=0;setTimeout(()=>sp.remove(),500)},1500);
}
boot();
</script>
